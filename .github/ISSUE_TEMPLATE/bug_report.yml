name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.

        **Security vulnerabilities must not be reported here.** This issue is public. Report them privately through a [security advisory](https://github.com/CoWork-OS/CoWork-OS/security/advisories/new) instead (see SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I click X, Y happens instead of Z..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open the app
        2. Select a workspace
        3. Create a new task with '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs after removing API keys, tokens, credentials, and other secrets.
      render: text

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - Security / Access Control
        - Messaging Channels
        - LLM Provider Integration
        - Agent Execution / Tools
        - UI / Desktop App
        - MCP Integration
        - Remote Access (Tailscale, SSH, API)
        - Other
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS 26 (Tahoe)
        - macOS 15 (Sequoia)
        - macOS 14 (Sonoma)
        - macOS 13 (Ventura)
        - Older macOS (unsupported by 0.5.52+; specify version)
        - Windows 11
        - Windows 10
        - Other (specify in description)
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation Method
      options:
        - GitHub DMG / installer
        - npm global install
        - Source checkout
        - Other / Unknown
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: LLM Provider
      options:
        - Anthropic API
        - AWS Bedrock
        - Google Gemini
        - OpenRouter
        - OpenAI
        - Ollama (Local)
        - Other / Multiple
        - Not applicable
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App Version
      description: "Settings → About & Updates in the app, or `cowork --version` for npm installs"
      placeholder: "0.5.60"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: For npm global installs and source checkouts (`node --version`).
      placeholder: "22.12.0"

  - type: textarea
    id: integrations
    attributes:
      label: Messaging Channels / MCP Servers
      description: Connected messaging channels (WhatsApp, Telegram, Discord, Slack, iMessage, ...) and MCP servers involved, if any.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Anything else that helps explain the problem.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this bug hasn't been reported
          required: true
        - label: I am using the latest version of CoWork OS
          required: false
        - label: This is NOT a security vulnerability (those go to a private security advisory, see SECURITY.md)
          required: true
