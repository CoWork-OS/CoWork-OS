version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps"
    groups:
      # Group minor and patch updates together
      minor-and-patch:
        patterns:
          - "*"
        # These updates need deliberate work, so they arrive as their own PRs
        # instead of blocking every grouped update:
        # - The renderer build pins the exact Mermaid parser sources
        #   (scripts/build/mermaid-parser/source-lock.json) and fails on any
        #   other version.
        # - The pdf.js chunk sits close to the 500 kB renderer chunk budget
        #   (scripts/qa/check-renderer-bundles.mjs); 6.5 pushes it over.
        exclude-patterns:
          - "mermaid"
          - "@mermaid-js/*"
          - "pdfjs-dist"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
