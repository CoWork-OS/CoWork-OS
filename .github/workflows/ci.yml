name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; jobs that need more request it explicitly.
permissions:
  contents: read

# A new push to a pull request cancels that PR's run still in progress, so pushes
# in quick succession don't each run the whole pipeline. Pushes to main and manual
# runs get a group of their own (the run id), so every main commit is still tested.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  registry-publication-tests:
    name: Registry publication recovery tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node --test scripts/release/*.test.mjs

  documentation-versions:
    name: Documentation Version Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node --test scripts/qa/validate-doc-versions.test.mjs
      - run: npm run test:release-surfaces
      - run: npm run qa:docs-versions
      - run: npm run qa:positioning-copy

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.30.1"
          # TODO(security): pin this download by sha256 before relying on it.
          # GitHub permits deleting and re-uploading a release asset under the
          # same name, so the version tag alone does not identify these bytes,
          # and this binary is installed onto PATH and executed on every push
          # to main. Fill in the digest from
          #   https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt
          # then add:  echo "${sha256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Resolve commit range
        id: range
        shell: bash
        run: |
          set -euo pipefail
          event_name="${{ github.event_name }}"

          if [ "$event_name" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            echo "log_opts=${base}..${head}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          head="${{ github.sha }}"

          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            if git rev-parse "${head}~1" >/dev/null 2>&1; then
              echo "log_opts=${head}~1..${head}" >> "$GITHUB_OUTPUT"
            else
              echo "log_opts=${head}" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "log_opts=${before}..${head}" >> "$GITHUB_OUTPUT"

      - name: Run gitleaks on new commits
        run: gitleaks git --no-banner --redact --log-opts="${{ steps.range.outputs.log_opts }}"

  regression-policy:
    name: Regression Policy Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Test regression policy classification
        run: node --test scripts/qa/enforce_eval_regression_policy.test.cjs

      - name: Enforce production-failure eval regression policy
        run: npm run qa:eval:enforce-regressions

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run lint
        run: npm run lint

      - name: Check formatting
        run: npm run fmt:check

      - name: Run TypeScript type check
        run: npm run type-check

  # npm test is skills:check, then the node:test suites, then vitest. The first two
  # are quick and need no native setup, so they run here; vitest runs in the
  # sharded test job below.
  test-node:
    name: Skills Check & Node Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check skills
        run: npm run skills:check

      - name: Run node:test suites
        run: npm run test:node

  test:
    # The vitest files are split across four runners; one runner took ~9 minutes.
    name: Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Install Chromium for browser integration tests
        run: npx playwright install --with-deps chromium

      - name: Rebuild node-pty for tests
        run: npm rebuild node-pty --ignore-scripts=false --no-audit --no-fund

      # Building the Numbat runtime downloads a Go SDK and compiles pinned sources
      # (~35 s). Pushes to main save the result; other runs restore it and verify
      # the checksums instead of rebuilding.
      - name: Restore Numbat runtime
        id: numbat-cache
        uses: actions/cache/restore@v6
        with:
          path: build/numbat
          key: numbat-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('resources/numbat/**', 'scripts/build_numbat_runtime.mjs') }}

      - name: Build Numbat runtime
        if: steps.numbat-cache.outputs.cache-hit != 'true'
        run: npm run numbat:build

      - name: Verify restored Numbat runtime
        if: steps.numbat-cache.outputs.cache-hit == 'true'
        run: node scripts/build_numbat_runtime.mjs --verify-only

      - name: Save Numbat runtime
        if: github.event_name != 'pull_request' && matrix.shard == 1 && steps.numbat-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/numbat
          key: ${{ steps.numbat-cache.outputs.cache-primary-key }}

      - name: Setup Python for Android worker guard tests
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Android worker test image dependency
        run: python -m pip install pillow==12.3.0

      - name: Run tests
        run: npx vitest run --shard=${{ matrix.shard }}/4

  test-macos:
    # The release workflow runs the suite on macOS too (sandbox-exec, Keychain and slower
    # runners); run it on every push to main (and on manual runs) so macOS-only failures
    # surface right after merge, not mid-release. Pull requests skip it to keep their CI fast.
    name: Tests (macOS)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Install Chromium for browser integration tests
        run: npx playwright install chromium

      - name: Prepare native test dependencies and Numbat fixtures
        run: |
          npm rebuild node-pty --ignore-scripts=false --no-audit --no-fund
          npm run numbat:build

      - name: Setup Python for Android worker guard tests
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Android worker test image dependency
        run: python -m pip install pillow==12.3.0

      - name: Run tests
        run: npm test

  targeted-eval:
    name: Targeted Eval (Agent Changes)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Detect agent-path changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            agent:
              - 'src/electron/agent/**'
              - 'src/electron/agent/tools/**'
              - 'src/electron/sessions/**'
              - 'src/electron/eval/**'
              - 'src/electron/memory/TranscriptStore.ts'
              - 'src/electron/database/**'
              - 'src/shared/**'
              - 'scripts/qa/**'
              - 'tests/qa-*.test.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'vitest.config.mts'
              - '.github/workflows/ci.yml'

      - name: Setup Node.js
        if: steps.changes.outputs.agent == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        if: steps.changes.outputs.agent == 'true'
        run: npm ci

      - name: Install sqlite3 CLI
        if: steps.changes.outputs.agent == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Prepare native harness test dependency
        if: steps.changes.outputs.agent == 'true'
        run: npm rebuild better-sqlite3 --ignore-scripts=false --no-audit --no-fund

      - name: Run deterministic harness regressions
        if: steps.changes.outputs.agent == 'true'
        run: npm run qa:harness

      - name: Skip notice
        if: steps.changes.outputs.agent != 'true'
        run: echo "No agent-path changes detected. Skipping targeted eval gate."

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Gated only on the secret scan (~10 s). Waiting for lint (~2.5 min) or the tests
    # put the build on the critical path; a red lint or test still fails the run.
    needs: [secret-scan]
    env:
      # The Electron TypeScript build exceeds Node's default heap on the 7 GB macOS runners.
      NODE_OPTIONS: --max-old-space-size=4096
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Packaging the installers takes ~10 minutes per OS. Pull requests only compile
      # (npm run build) unless they touch what packaging depends on; pushes to main
      # and manual runs always package.
      - name: Detect packaging changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            packaging:
              - 'package.json'
              - 'package-lock.json'
              - 'build/**'
              - 'native/**'
              - 'assets/tray/**'
              - 'resources/bot-desktop/**'
              - 'resources/computer-use/**'
              - 'resources/fonts/**'
              - 'resources/numbat/**'
              - 'scripts/run_electron_builder.mjs'
              - 'scripts/release-artifact-names.mjs'
              - 'scripts/package-*.mjs'
              - 'scripts/build_numbat_runtime.mjs'
              - 'scripts/build_location_helper*.mjs'
              - 'scripts/copy_location_helpers.mjs'
              - 'scripts/build-native-session-probe.mjs'
              - 'scripts/clean-build-output.mjs'
              - '.github/workflows/ci.yml'

      - name: Decide whether to package
        id: packaging
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ steps.changes.outputs.packaging }}" = "true" ]; then
            echo "package=true" >> "$GITHUB_OUTPUT"
          else
            echo "package=false" >> "$GITHUB_OUTPUT"
            echo "No packaging changes in this pull request; compiling without electron-builder."
          fi

      # npm run package runs the full build itself, so build separately only when not packaging.
      - name: Build application
        if: steps.packaging.outputs.package != 'true'
        run: npm run build

      - name: Prepare package.json for electron-builder
        if: steps.packaging.outputs.package == 'true'
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.dependencies = pkg.dependencies || {};
            pkg.devDependencies = pkg.devDependencies || {};
            for (const dep of ['electron', '@electron/rebuild']) {
              if (pkg.dependencies[dep]) {
                pkg.devDependencies[dep] = pkg.dependencies[dep];
                delete pkg.dependencies[dep];
              }
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Package application
        if: steps.packaging.outputs.package == 'true'
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: steps.packaging.outputs.package == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: CoWork-OSS-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: warn
