name: Nightly Hardening

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  hardening:
    name: Deterministic Harness + Optional Live Battery (Node 24)
    runs-on: ubuntu-latest
    env:
      HARDENING_REQUIRED_AFTER_UTC: "2026-03-14T00:00:00Z"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install sqlite3 CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Prepare artifact directory
        run: mkdir -p .artifacts/hardening

      - name: Prepare native harness test dependency
        run: npm rebuild better-sqlite3 --ignore-scripts=false --no-audit --no-fund

      - name: Run deterministic harness regressions
        id: run_eval_suite
        continue-on-error: true
        run: |
          set -euo pipefail
          npm run qa:harness \
            | tee .artifacts/hardening/eval-suite.log

      - name: Run optional live battery when hooks are configured
        id: run_battery
        continue-on-error: true
        env:
          COWORK_HOOKS_ORIGIN: ${{ secrets.COWORK_HOOKS_ORIGIN }}
          COWORK_HOOKS_TOKEN: ${{ secrets.COWORK_HOOKS_TOKEN }}
          COWORK_DB_PATH: ${{ secrets.COWORK_DB_PATH }}
        run: |
          set -euo pipefail
          echo "coverage=failed" >> "$GITHUB_OUTPUT"
          if [ -z "${COWORK_HOOKS_ORIGIN}" ] && [ -z "${COWORK_HOOKS_TOKEN}" ] && [ -z "${COWORK_DB_PATH}" ]; then
            echo "coverage=not_configured" >> "$GITHUB_OUTPUT"
            echo "Optional live battery not configured; no live battery coverage claimed." | tee .artifacts/hardening/battery.log
          elif [ -n "${COWORK_HOOKS_ORIGIN}" ] && [ -n "${COWORK_HOOKS_TOKEN}" ] && [ -n "${COWORK_DB_PATH}" ]; then
            node scripts/qa/run_battery.cjs | tee .artifacts/hardening/battery.log
            echo "coverage=completed" >> "$GITHUB_OUTPUT"
          else
            echo "Incomplete live battery configuration: all three hook/database secrets are required." | tee .artifacts/hardening/battery.log
            exit 1
          fi

      - name: Build grouped hardening summary
        if: always()
        run: |
          {
            echo "# Nightly Hardening Summary"
            echo
            echo "Production corpus replay is not configured on this fresh runner; no production coverage claimed."
            echo
            echo "## Deterministic Harness Regressions and Replay Fixtures"
            tail -n 80 .artifacts/hardening/eval-suite.log || true
            echo
            echo "## Battery"
            tail -n 80 .artifacts/hardening/battery.log || true
          } > .artifacts/hardening/summary.md

      - name: Build machine-readable hardening report
        if: always()
        env:
          RUN_EVAL_OUTCOME: ${{ steps.run_eval_suite.outcome }}
          RUN_BATTERY_OUTCOME: ${{ steps.run_battery.outcome }}
          BATTERY_COVERAGE: ${{ steps.run_battery.outputs.coverage }}
        run: |
          cat > .artifacts/hardening/report.json <<JSON
          {
            "requiredAfterUtc": "${HARDENING_REQUIRED_AFTER_UTC}",
            "generatedAtUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "steps": {
              "runEvalSuite": "${RUN_EVAL_OUTCOME}",
              "runBattery": "${RUN_BATTERY_OUTCOME}",
              "optionalBatteryCoverage": "${BATTERY_COVERAGE}",
              "productionCorpusCoverage": "not_configured"
            }
          }
          JSON

      - name: Enforce hardening gate after stability window
        if: always()
        env:
          RUN_EVAL_OUTCOME: ${{ steps.run_eval_suite.outcome }}
          RUN_BATTERY_OUTCOME: ${{ steps.run_battery.outcome }}
          BATTERY_COVERAGE: ${{ steps.run_battery.outputs.coverage }}
        run: |
          set -euo pipefail
          now_epoch="$(date -u +%s)"
          cutoff_epoch="$(date -u -d "${HARDENING_REQUIRED_AFTER_UTC}" +%s)"
          strict_mode="false"
          if [ "${now_epoch}" -ge "${cutoff_epoch}" ]; then
            strict_mode="true"
          fi

          echo "Hardening strict mode: ${strict_mode} (cutoff: ${HARDENING_REQUIRED_AFTER_UTC})"
          echo "Outcomes: deterministic_harness=${RUN_EVAL_OUTCOME} optional_battery=${RUN_BATTERY_OUTCOME} coverage=${BATTERY_COVERAGE}"

          if [ "${strict_mode}" != "true" ]; then
            echo "Stability window active. Failures are non-blocking."
            exit 0
          fi

          if [ "${RUN_EVAL_OUTCOME}" != "success" ] || [ "${RUN_BATTERY_OUTCOME}" != "success" ] || { [ "${BATTERY_COVERAGE}" != "completed" ] && [ "${BATTERY_COVERAGE}" != "not_configured" ]; }; then
            echo "Hardening gate failed after stability window."
            exit 1
          fi

          echo "Deterministic harness gate passed. Optional live battery coverage: ${BATTERY_COVERAGE}."

      - name: Upload hardening artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightly-hardening-${{ github.run_id }}
          path: .artifacts/hardening/
          if-no-files-found: warn
