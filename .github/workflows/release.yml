name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  actions: read

# Shared with registry recovery: never interrupt a publication halfway through.
concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  hardening-release-gate:
    name: Hardening Release Gate
    runs-on: ubuntu-latest
    env:
      HARDENING_REQUIRED_AFTER_UTC: "2026-03-14T00:00:00Z"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Check documentation version policy
        run: npm run qa:docs-versions

      - name: Test registry publication recovery
        run: node --test scripts/release/*.test.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install sqlite3 CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Prepare native harness test dependency
        run: npm rebuild better-sqlite3 --ignore-scripts=false --no-audit --no-fund

      - name: Run deterministic harness regressions
        id: run_eval_suite
        continue-on-error: true
        run: npm run qa:harness

      - name: Run optional live battery when hooks are configured
        id: run_battery
        continue-on-error: true
        env:
          COWORK_HOOKS_ORIGIN: ${{ secrets.COWORK_HOOKS_ORIGIN }}
          COWORK_HOOKS_TOKEN: ${{ secrets.COWORK_HOOKS_TOKEN }}
          COWORK_DB_PATH: ${{ secrets.COWORK_DB_PATH }}
        run: |
          set -euo pipefail
          echo "coverage=failed" >> "$GITHUB_OUTPUT"
          if [ -z "${COWORK_HOOKS_ORIGIN}" ] && [ -z "${COWORK_HOOKS_TOKEN}" ] && [ -z "${COWORK_DB_PATH}" ]; then
            echo "coverage=not_configured" >> "$GITHUB_OUTPUT"
            echo "Optional live battery not configured; no live battery coverage claimed."
          elif [ -n "${COWORK_HOOKS_ORIGIN}" ] && [ -n "${COWORK_HOOKS_TOKEN}" ] && [ -n "${COWORK_DB_PATH}" ]; then
            node scripts/qa/run_battery.cjs
            echo "coverage=completed" >> "$GITHUB_OUTPUT"
          else
            echo "Incomplete live battery configuration: all three hook/database secrets are required."
            exit 1
          fi

      - name: Enforce release hardening gate
        env:
          RUN_EVAL_OUTCOME: ${{ steps.run_eval_suite.outcome }}
          RUN_BATTERY_OUTCOME: ${{ steps.run_battery.outcome }}
          BATTERY_COVERAGE: ${{ steps.run_battery.outputs.coverage }}
        run: |
          set -euo pipefail
          now_epoch="$(date -u +%s)"
          cutoff_epoch="$(date -u -d "${HARDENING_REQUIRED_AFTER_UTC}" +%s)"
          strict_mode="false"
          if [ "${now_epoch}" -ge "${cutoff_epoch}" ]; then
            strict_mode="true"
          fi

          echo "Release hardening strict mode: ${strict_mode} (cutoff: ${HARDENING_REQUIRED_AFTER_UTC})"
          echo "Outcomes: eval=${RUN_EVAL_OUTCOME} optional_battery=${RUN_BATTERY_OUTCOME} coverage=${BATTERY_COVERAGE}"

          if [ "${strict_mode}" != "true" ]; then
            echo "Stability window active. Hardening failures do not block release."
            exit 0
          fi

          if [ "${RUN_EVAL_OUTCOME}" != "success" ] || [ "${RUN_BATTERY_OUTCOME}" != "success" ] || { [ "${BATTERY_COVERAGE}" != "completed" ] && [ "${BATTERY_COVERAGE}" != "not_configured" ]; }; then
            echo "Release blocked: hardening gate failed after stability window."
            exit 1
          fi

          echo "Deterministic harness gate passed. Optional live battery coverage: ${BATTERY_COVERAGE}."

  release:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    needs: hardening-release-gate
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Force HTTPS for GitHub git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Ensure Electron binary is installed
        if: runner.os != 'Windows'
        run: node node_modules/electron/install.js

      - name: Resolve release metadata
        id: release_metadata
        shell: bash
        run: |
          npm_version="$(node -p "require('./package.json').version")"

          if [ "${GITHUB_REF_NAME}" != "${npm_version}" ] && [ "${GITHUB_REF_NAME}" != "v${npm_version}" ]; then
            echo "Tag mismatch: GITHUB_REF_NAME=${GITHUB_REF_NAME} but package.json is ${npm_version}" >&2
            exit 1
          fi

          release_tag="v${npm_version}"
          if [ "${GITHUB_REF_NAME}" = "${npm_version}" ]; then
            release_tag="v${npm_version}"
          fi

          echo "npm_version=${npm_version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        if: runner.os != 'Windows'
        run: |
          npm rebuild node-pty --ignore-scripts=false --no-audit --no-fund
          npm run numbat:build
          npm test

      - name: Validate npm tarball first-install flow
        if: runner.os != 'Windows'
        run: node scripts/release-smoke-install.mjs

      - name: Build application
        run: npm run build

      - name: Generate release notes from changelog
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const version = process.env.NPM_VERSION;
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const marker = `## [${version}]`;
          const start = changelog.indexOf(marker);

          if (start === -1) {
            fs.writeFileSync(
              'release-notes.md',
              `## ${version}\n\nNo changelog entry found for ${version}.\n`
            );
            process.exit(0);
          }

          const tail = changelog.slice(start + marker.length);
          const nextMatch = tail.match(/\n## \[/);
          const end = nextMatch ? start + marker.length + nextMatch.index : changelog.length;
          const entry = changelog.slice(start, end).trim();
          fs.writeFileSync('release-notes.md', `${entry}\n`);
          NODE
        env:
          NPM_VERSION: ${{ steps.release_metadata.outputs.npm_version }}

      - name: Prepare draft GitHub release for packaging
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_tag="${{ steps.release_metadata.outputs.release_tag }}"
          npm_version="${{ steps.release_metadata.outputs.npm_version }}"
          release_title="Release ${npm_version}"

          # Handle parallel matrix jobs safely: create if missing, otherwise edit.
          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Found existing release tag: ${release_tag}"
            gh release edit "${release_tag}" --repo "${GITHUB_REPOSITORY}" --title "${release_title}" --notes-file release-notes.md --draft=true
          elif gh release create "${release_tag}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "${release_title}" --notes-file release-notes.md --draft; then
            echo "Created draft release: ${release_tag}"
          else
            echo "Release create failed (likely concurrent create); retrying edit."
            gh release edit "${release_tag}" --repo "${GITHUB_REPOSITORY}" --title "${release_title}" --notes-file release-notes.md --draft=true
          fi

          echo "Cowork release draft prepared: ${release_tag}"

      - name: Prepare package.json for electron-builder
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.dependencies = pkg.dependencies || {};
            pkg.devDependencies = pkg.devDependencies || {};
            for (const dep of ['electron', '@electron/rebuild']) {
              if (pkg.dependencies[dep]) {
                pkg.devDependencies[dep] = pkg.dependencies[dep];
                delete pkg.dependencies[dep];
              }
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Package and publish Electron app
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "macOS" ]; then
            npm run numbat:build
            COWORK_MAC_UNSIGNED=1 node scripts/run_electron_builder.mjs --mac --publish never
          else
            npm run package
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # unsigned macOS build publishing to GitHub releases

      - name: Align packaged artifact names with updater metadata
        run: node scripts/release-artifact-names.mjs

      - name: Verify expected desktop artifacts exist
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-artifact-names.mjs --check
          shopt -s nullglob
          if [ "${RUNNER_OS}" = "Windows" ]; then
            windows_artifacts=(release/*.exe)
            if [ "${#windows_artifacts[@]}" -eq 0 ]; then
              echo "No Windows installer (.exe) found in release/." >&2
              exit 1
            fi
            printf 'Windows artifacts:\n'
            printf '  %s\n' "${windows_artifacts[@]}"
          fi
          if [ "${RUNNER_OS}" = "macOS" ]; then
            mac_artifacts=(release/*.dmg)
            if [ "${#mac_artifacts[@]}" -eq 0 ]; then
              echo "No macOS installer (.dmg) found in release/." >&2
              exit 1
            fi
            printf 'macOS artifacts:\n'
            printf '  %s\n' "${mac_artifacts[@]}"
          fi

      - name: Smoke desktop release artifacts
        shell: bash
        run: |
          set -euo pipefail
          smoke_args=(-- --expected-version=${{ steps.release_metadata.outputs.npm_version }})
          if [ "${RUNNER_OS}" = "macOS" ]; then
            smoke_args+=(--allow-unsigned)
          fi
          npm run package:desktop:smoke "${smoke_args[@]}"

      - name: Sign release artifacts
        shell: bash
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Detached Ed25519 signatures over each artifact. Neither platform is
          # code-signed, so this is what lets the app refuse a tampered update
          # instead of trusting a sha512 published beside the artifact it
          # describes. No-ops (with a message) until the secret is configured.
          node scripts/release/sign-release-artifacts.mjs

      - name: Upload release artifacts explicitly
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          release_tag="${{ steps.release_metadata.outputs.release_tag }}"
          artifacts=(release/*.exe release/*.dmg release/*.zip release/*.yml release/*.blockmap release/*.sig)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No release artifacts found to upload." >&2
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            [ -f "${artifact}" ] || continue
            echo "Uploading ${artifact}"
            gh release upload "${release_tag}" "${artifact}" --repo "${GITHUB_REPOSITORY}" --clobber
          done

  release-linux-server:
    name: Release Linux server package
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: hardening-release-gate

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Force HTTPS for GitHub git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve release metadata
        id: release_metadata
        shell: bash
        run: |
          npm_version="$(node -p "require('./package.json').version")"

          if [ "${GITHUB_REF_NAME}" != "${npm_version}" ] && [ "${GITHUB_REF_NAME}" != "v${npm_version}" ]; then
            echo "Tag mismatch: GITHUB_REF_NAME=${GITHUB_REF_NAME} but package.json is ${npm_version}" >&2
            exit 1
          fi

          release_tag="v${npm_version}"
          if [ "${GITHUB_REF_NAME}" = "${npm_version}" ]; then
            release_tag="v${npm_version}"
          fi

          echo "npm_version=${npm_version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes from changelog
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const version = process.env.NPM_VERSION;
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const marker = `## [${version}]`;
          const start = changelog.indexOf(marker);

          if (start === -1) {
            fs.writeFileSync(
              'release-notes.md',
              `## ${version}\n\nNo changelog entry found for ${version}.\n`
            );
            process.exit(0);
          }

          const tail = changelog.slice(start + marker.length);
          const nextMatch = tail.match(/\n## \[/);
          const end = nextMatch ? start + marker.length + nextMatch.index : changelog.length;
          const entry = changelog.slice(start, end).trim();
          fs.writeFileSync('release-notes.md', `${entry}\n`);
          NODE
        env:
          NPM_VERSION: ${{ steps.release_metadata.outputs.npm_version }}

      - name: Prepare draft GitHub release for packaging
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_tag="${{ steps.release_metadata.outputs.release_tag }}"
          npm_version="${{ steps.release_metadata.outputs.npm_version }}"
          release_title="Release ${npm_version}"

          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Found existing release tag: ${release_tag}"
            gh release edit "${release_tag}" --repo "${GITHUB_REPOSITORY}" --title "${release_title}" --notes-file release-notes.md --draft=true
          elif gh release create "${release_tag}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "${release_title}" --notes-file release-notes.md --draft; then
            echo "Created draft release: ${release_tag}"
          else
            echo "Release create failed (likely concurrent create); retrying edit."
            gh release edit "${release_tag}" --repo "${GITHUB_REPOSITORY}" --title "${release_title}" --notes-file release-notes.md --draft=true
          fi

      - name: Package Linux server tarball
        run: npm run package:linux:server

      - name: Smoke test Linux server tarball
        run: npm run package:linux:server:smoke

      - name: Verify expected Linux server artifacts exist
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          server_artifacts=(release/cowork-os-server-linux-x64-v*.tar.gz)
          server_checksums=(release/cowork-os-server-linux-x64-v*.tar.gz.sha256)
          if [ "${#server_artifacts[@]}" -ne 1 ]; then
            echo "Expected exactly one Linux server tarball in release/." >&2
            exit 1
          fi
          if [ "${#server_checksums[@]}" -ne 1 ]; then
            echo "Expected exactly one Linux server checksum in release/." >&2
            exit 1
          fi
          (cd release && sha256sum --check "$(basename "${server_checksums[0]}")")
          printf 'Linux server artifacts:\n'
          printf '  %s\n' "${server_artifacts[@]}" "${server_checksums[@]}"

      - name: Upload Linux server release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          release_tag="${{ steps.release_metadata.outputs.release_tag }}"
          artifacts=(release/cowork-os-server-linux-x64-v*.tar.gz release/cowork-os-server-linux-x64-v*.tar.gz.sha256)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No Linux server release artifacts found to upload." >&2
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            echo "Uploading ${artifact}"
            gh release upload "${release_tag}" "${artifact}" --repo "${GITHUB_REPOSITORY}" --clobber
          done

  prepare-registry:
    name: Prepare registry packages
    runs-on: macos-latest
    needs: [release, release-linux-server]
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_BUNDLE_DIR: ${{ runner.temp }}/registry-bundle
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Restore exact packages or validate first preparation
        id: restore
        run: node scripts/release/package-bundle.mjs restore --allow-missing
      - name: Force HTTPS for GitHub git dependencies
        if: steps.restore.outputs.restored != 'true'
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
      - name: Install dependencies
        if: steps.restore.outputs.restored != 'true'
        run: npm ci --no-audit --no-fund
      - name: Build packages once
        if: steps.restore.outputs.restored != 'true'
        run: npm run build
      - name: Retain and verify exact registry packages
        if: steps.restore.outputs.restored != 'true'
        run: node scripts/release/package-bundle.mjs prepare
      - name: Smoke test retained package installations
        run: node scripts/release/smoke-bundle.mjs

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [prepare-registry]
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_BUNDLE_DIR: ${{ runner.temp }}/registry-bundle
      RELEASE_TARGET: npm
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Restore exact registry packages
        run: node scripts/release/package-bundle.mjs restore
      - name: Verify release prerequisite evidence
        run: node scripts/release/package-bundle.mjs verify-evidence
      - name: Publish or verify npm package
        run: node scripts/release/registry-publication.mjs publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: [prepare-registry]
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_BUNDLE_DIR: ${{ runner.temp }}/registry-bundle
      RELEASE_TARGET: github
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@cowork-os"
      - name: Restore exact registry packages
        run: node scripts/release/package-bundle.mjs restore
      - name: Verify release prerequisite evidence
        run: node scripts/release/package-bundle.mjs verify-evidence
      - name: Publish or verify GitHub package
        run: node scripts/release/registry-publication.mjs publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [release, release-linux-server, publish-npm, publish-github-packages]
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_BUNDLE_DIR: ${{ runner.temp }}/registry-bundle
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Restore exact registry packages
        run: node scripts/release/package-bundle.mjs restore
      - name: Verify release prerequisite evidence
        run: node scripts/release/package-bundle.mjs verify-evidence
      - name: Verify npm publication
        run: node scripts/release/registry-publication.mjs verify
        env:
          RELEASE_TARGET: npm
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify GitHub Packages publication
        run: node scripts/release/registry-publication.mjs verify
        env:
          RELEASE_TARGET: github
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified GitHub release
        run: |
          set -euo pipefail
          if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          fi
