name: Secrets Upgrade Smoke

# Upgrades a disposable profile from the previous release to this build on each desktop
# platform's real OS keychain (scripts/qa/secrets-upgrade-smoke.mjs): the packaged macOS
# app and Windows installer the way releases ship them, and the npm install on Linux with
# and without a Secret Service. See docs/secrets-encryption.md.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/electron/utils/safe-storage*.ts"
      - "src/electron/utils/mac-safe-storage-*.ts"
      - "src/electron/database/SecureSettingsRepository.ts"
      - "src/electron/database/secure-settings-*.ts"
      - "scripts/qa/secrets-upgrade-smoke.mjs"
      - ".github/workflows/secrets-upgrade-smoke.yml"
  workflow_dispatch:
    inputs:
      baseline_version:
        description: "Release to upgrade from (default: the latest published release)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: secrets-upgrade-${{ github.ref }}
  # A newer push waits instead of cancelling: a macOS leg takes half an hour to reach its
  # result, and that result still tells what the next run needs.
  cancel-in-progress: false

jobs:
  upgrade:
    name: Upgrade (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # The Electron TypeScript build exceeds Node's default heap on the 7 GB macOS runners.
      NODE_OPTIONS: --max-old-space-size=4096
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS app
            id: macos-app
            os: macos-latest
          - name: Windows installer
            id: windows-installer
            os: windows-latest
          - name: Linux npm, Secret Service
            id: linux-secret-service
            os: ubuntu-latest
            keyring: true
          - name: Linux npm, no keyring
            id: linux-no-keyring
            os: ubuntu-latest
            keyring: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Force HTTPS for GitHub git dependencies
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Resolve the baseline release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.baseline_version }}"
          if [ -z "${version}" ]; then
            version="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName -q .tagName)"
          fi
          echo "BASELINE_VERSION=${version#v}" >> "${GITHUB_ENV}"
          echo "Upgrading from ${version#v}"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Linux desktop test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 gnome-keyring libsecret-1-0
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox uses.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Rebuild native modules for Electron
        if: runner.os == 'Linux'
        run: npm run setup

      - name: Build this version
        run: npm run build

      - name: Package this version (ad hoc signed, as releases are)
        if: runner.os == 'macOS'
        env:
          COWORK_MAC_UNSIGNED: "1"
          # electron-builder skips signing on pull requests; releases build from tags, where
          # it signs ad hoc. Without a valid signature the keychain trusts no build at all.
          CSC_FOR_PULL_REQUEST: "true"
        run: node scripts/run_electron_builder.mjs --mac --dir --publish never

      - name: Package this version
        if: runner.os == 'Windows'
        run: node scripts/run_electron_builder.mjs --win --x64 --dir --publish never

      - name: Install the baseline macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/baseline"
          gh release download "v${BASELINE_VERSION}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "CoWork-OS-${BASELINE_VERSION}-arm64-mac.zip" --dir "${dir}"
          ditto -x -k "${dir}/CoWork-OS-${BASELINE_VERSION}-arm64-mac.zip" "${dir}"
          echo "BASELINE_TARGET=${dir}/CoWork OS.app" >> "${GITHUB_ENV}"
          echo "CURRENT_TARGET=${GITHUB_WORKSPACE}/release/mac-arm64/CoWork OS.app" >> "${GITHUB_ENV}"

      - name: Prepare a CI keychain both app versions can read
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # A runner has no one to answer a keychain prompt, and each ad hoc signed build is a
          # different app to the keychain. So the "CoWork OS Safe Storage" item is created up
          # front in a throwaway keychain and opened to both builds.
          keychain="${RUNNER_TEMP}/cowork-ci.keychain-db"
          security create-keychain -p ci "${keychain}"
          security set-keychain-settings "${keychain}"
          security unlock-keychain -p ci "${keychain}"
          # Only this keychain is searched, so both builds find the item prepared here.
          security list-keychains -d user -s "${keychain}"
          security default-keychain -d user -s "${keychain}"
          # Electron names the item "<app> Safe Storage" with account "<app> Key".
          security add-generic-password -a "CoWork OS Key" -s "CoWork OS Safe Storage" \
            -w "$(openssl rand -base64 24)" -A "${keychain}"
          # The keychain identifies an ad hoc signed app by its signature, so it must be valid.
          codesign --verify --deep --strict --verbose=2 "${CURRENT_TARGET}"
          codesign --verify --deep --strict --verbose=2 "${BASELINE_TARGET}" || true
          partitions="apple-tool:,apple:,unsigned:"
          for app in "${BASELINE_TARGET}" "${CURRENT_TARGET}"; do
            cdhash="$(codesign -dvvv "${app}" 2>&1 | sed -n 's/^CDHash=//p' | head -1)"
            [ -n "${cdhash}" ] && partitions="${partitions},cdhash:${cdhash}"
          done
          security set-generic-password-partition-list -a "CoWork OS Key" -s "CoWork OS Safe Storage" \
            -S "${partitions}" -k ci "${keychain}" > /dev/null
          echo "Partition list: ${partitions}"

      - name: Install the baseline Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "baseline"
          gh release download "v$env:BASELINE_VERSION" --repo $env:GITHUB_REPOSITORY `
            --pattern "CoWork-OS-Setup-$env:BASELINE_VERSION.exe" --dir $dir
          $target = Join-Path $env:RUNNER_TEMP "baseline-app"
          Start-Process -Wait -FilePath (Join-Path $dir "CoWork-OS-Setup-$env:BASELINE_VERSION.exe") `
            -ArgumentList "/S", "/D=$target"
          Stop-Process -Name "CoWork OS" -ErrorAction SilentlyContinue
          $exe = Join-Path $target "CoWork OS.exe"
          if (-not (Test-Path $exe)) {
            $exe = Join-Path $env:LOCALAPPDATA "Programs\CoWork OS\CoWork OS.exe"
          }
          if (-not (Test-Path $exe)) { throw "The baseline installer did not install CoWork OS.exe" }
          "BASELINE_TARGET=$exe" >> $env:GITHUB_ENV
          "CURRENT_TARGET=$(Join-Path $env:GITHUB_WORKSPACE 'release\win-unpacked\CoWork OS.exe')" >> $env:GITHUB_ENV

      - name: Install the baseline npm package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/baseline"
          mkdir -p "${dir}"
          cd "${dir}"
          echo '{"name":"baseline","private":true}' > package.json
          npm install --ignore-scripts --omit=optional --no-audit --no-fund --save-exact "cowork-os@${BASELINE_VERSION}"
          node node_modules/electron/install.js
          npm run --prefix node_modules/cowork-os setup
          echo "BASELINE_TARGET=${dir}/node_modules/cowork-os" >> "${GITHUB_ENV}"
          echo "CURRENT_TARGET=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"

      - name: Upgrade from the baseline
        if: runner.os != 'Linux'
        shell: bash
        run: |
          node scripts/qa/secrets-upgrade-smoke.mjs --baseline "${BASELINE_TARGET}" \
            --current "${CURRENT_TARGET}" --out "${RUNNER_TEMP}/secrets-upgrade"

      - name: Upgrade from the baseline (Secret Service)
        if: runner.os == 'Linux' && matrix.keyring
        shell: bash
        env:
          # A desktop session, so Chromium picks the Secret Service as on GNOME.
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          cat > "${RUNNER_TEMP}/with-keyring.sh" <<'EOF'
          echo -n ci | gnome-keyring-daemon --unlock --components=secrets --replace --daemonize > /dev/null
          exec xvfb-run -a "$@"
          EOF
          dbus-run-session -- bash "${RUNNER_TEMP}/with-keyring.sh" \
            node scripts/qa/secrets-upgrade-smoke.mjs --baseline "${BASELINE_TARGET}" \
            --current "${CURRENT_TARGET}" --out "${RUNNER_TEMP}/secrets-upgrade"

      - name: Upgrade from the baseline (no keyring)
        if: runner.os == 'Linux' && !matrix.keyring
        shell: bash
        run: |
          xvfb-run -a node scripts/qa/secrets-upgrade-smoke.mjs --baseline "${BASELINE_TARGET}" \
            --current "${CURRENT_TARGET}" --out "${RUNNER_TEMP}/secrets-upgrade" --expect=app

      - name: Show the CI keychain items
        if: always() && runner.os == 'macOS'
        timeout-minutes: 3
        shell: bash
        run: |
          security list-keychains -d user
          security default-keychain -d user
          security show-keychain-info "${RUNNER_TEMP}/cowork-ci.keychain-db" 2>&1 || true
          # Attributes and access lists only; nothing here decrypts a secret.
          security dump-keychain -a "${RUNNER_TEMP}/cowork-ci.keychain-db" 2>&1 | head -200 || true

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: secrets-upgrade-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/secrets-upgrade/*.log
            ${{ runner.temp }}/secrets-upgrade/results.json
          if-no-files-found: warn
