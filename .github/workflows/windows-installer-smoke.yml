name: Windows Installer Smoke

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Expected package version"
        required: true
        default: "0.5.43"

permissions:
  contents: read

jobs:
  smoke:
    name: Build and smoke Windows installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Force HTTPS for GitHub git dependencies
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify release version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -ne "${{ inputs.expected_version }}") {
            throw "Expected version ${{ inputs.expected_version }}, found $version"
          }

      - name: Package Windows installer
        run: npm run package

      - name: Smoke Windows installer
        run: npm run package:win:smoke -- --expected-version=${{ inputs.expected_version }}
